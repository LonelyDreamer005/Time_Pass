<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiPokeDex | Find Your Pokémon</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" type="image/png">
</head>
<body>
    <div class="app-container">
        <div class="left-panel">
            <div class="header-container">
                <h1><i class="fa-solid fa-gamepad"></i> AiPokeDex</h1>
                <button id="theme-toggle" title="Toggle dark/light mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
            
            <div class="search-section">
                <p class="search-desc">Search for any Pokémon by name to get detailed information about it.</p>
                <div class="input-container">
                    <div class="autocomplete-wrapper">
                        <input id="user-input" type="text" autocomplete="off" placeholder="Search for a Pokémon...">
                        <ul id="autocomplete-list" class="autocomplete-items"></ul>
                    </div>
                    <div class="button-group">
                        <button id="send-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
                        <button id="clear-btn" class="secondary-btn"><i class="fa-solid fa-broom"></i> Clear</button>
                    </div>
                </div>
            </div>
            
            <div class="footer">
                <p>Powered by <a href="https://pokeapi.co/" target="_blank">PokeAPI</a></p>
            </div>
        </div>
        
        <div class="right-panel">
            <div id="chat-box">
                <div class="welcome-message card">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="Pokeball" class="welcome-img">
                    <h3>Welcome, Trainer!</h3>
                    <p>Enter a Pokémon name on the left to see its details here.</p>
                    <p>Try searching for "pikachu", "charizard", or "mewtwo"!</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
